<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Криштиану Роналду • Клубы и статистика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b1120;
            color: #e5e9f0;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Фоновый эффект */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 20%, #1a2a4a, #0b1120 70%);
            z-index: -1;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        /* ===== HERO ===== */
        .hero {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2rem;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 2.5rem;
            padding: 2rem 2.5rem;
            margin-bottom: 3rem;
            transition: border-color 0.3s;
        }

        .hero:hover {
            border-color: rgba(255, 215, 0, 0.3);
        }

        .hero-text {
            flex: 2;
        }

        .hero-text .badge {
            display: inline-block;
            background: #ffd70020;
            color: #ffd700;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 0.25rem 1rem;
            border-radius: 30px;
            border: 1px solid #ffd70040;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
        }

        .hero-text h1 {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .hero-text h1 .gold {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-text .sub {
            font-size: 1.1rem;
            color: #9aaec9;
            margin-top: 0.5rem;
            border-left: 3px solid #ffd700;
            padding-left: 1.2rem;
        }

        .hero-text .stats-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            margin-top: 1.5rem;
        }

        .hero-text .stats-legend span {
            font-weight: 700;
            font-size: 0.9rem;
            color: #cdd9f0;
        }

        .hero-text .stats-legend i {
            color: #ffd700;
            margin-right: 0.3rem;
        }

        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image img {
            max-width: 220px;
            width: 100%;
            height: auto;
            border-radius: 30px;
            border: 3px solid #ffd70060;
            box-shadow: 0 20px 35px -8px #000000aa;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .hero-image img:hover {
            transform: scale(1.02);
            box-shadow: 0 25px 45px -8px #000000cc;
        }

        /* ===== СЕКЦИЯ КЛУБОВ ===== */
        .section-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 2.8rem 0 1.8rem;
        }

        .section-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .section-header i {
            color: #ffd700;
            font-size: 1.6rem;
        }

        .section-header .line {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, #ffd70060, transparent);
            margin-left: 0.5rem;
        }

        /* сетка клубов */
        .clubs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.8rem;
        }

        /* карточка клуба */
        .club-card {
            background: linear-gradient(160deg, #162033, #0f172a);
            border-radius: 1.8rem;
            padding: 1.5rem 1.5rem 1.2rem;
            border: 1px solid #2a3a5a;
            transition: all 0.3s cubic-bezier(0.15, 0.85, 0.35, 1);
            box-shadow: 0 8px 20px -8px #00000060;
            display: flex;
            flex-direction: column;
        }

        .club-card:hover {
            border-color: #ffd70080;
            transform: translateY(-6px);
            box-shadow: 0 16px 35px -10px #000000cc;
        }

        .club-card .top {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }

        .club-card .icon {
            width: 60px;
            height: 60px;
            background: #1f314a;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            border: 1px solid #3a4e70;
            flex-shrink: 0;
        }

        .club-card .name {
            flex: 1;
        }

        .club-card .name h3 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f0f4ff;
        }

        .club-card .name .period {
            font-size: 0.8rem;
            color: #a0b6d4;
            background: #1a2842;
            display: inline-block;
            padding: 0.15rem 0.9rem;
            border-radius: 20px;
            margin-top: 2px;
            border: 1px solid #2f4160;
        }

        .club-card .stats {
            display: flex;
            justify-content: space-around;
            background: #0b1322;
            border-radius: 1.2rem;
            padding: 0.7rem 0.2rem;
            margin: 0.8rem 0 1rem;
            border: 1px solid #253552;
        }

        .club-card .stats .stat {
            text-align: center;
        }

        .club-card .stats .stat .number {
            font-weight: 800;
            font-size: 1.5rem;
            color: #ffd700;
            line-height: 1.2;
        }

        .club-card .stats .stat .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #889dbe;
        }

        .club-card .honors {
            border-top: 1px solid #1f314a;
            padding-top: 0.9rem;
            margin-top: auto;
        }

        .club-card .honors p {
            font-weight: 600;
            font-size: 0.75rem;
            color: #ffd700b0;
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
        }

        .club-card .honors ul {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            list-style: none;
        }

        .club-card .honors ul li {
            background: #ffd70010;
            border: 1px solid #ffd70020;
            font-size: 0.7rem;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            color: #d4dcec;
            font-weight: 500;
        }

        .club-card .honors ul li i {
            color: #ffd700;
            font-size: 0.5rem;
            margin-right: 4px;
        }

        /* ===== СУММАРНАЯ СТАТИСТИКА ===== */
        .totals {
            margin: 2.8rem 0 1.5rem;
            background: linear-gradient(145deg, #14213d, #0b1322);
            border-radius: 2rem;
            padding: 1.8rem 2.2rem;
            border: 1px solid #2a3d60;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 1.5rem;
        }

        .totals .item {
            text-align: center;
        }

        .totals .item .num {
            font-size: 2.4rem;
            font-weight: 900;
            color: #ffd700;
        }

        .totals .item .desc {
            font-size: 0.8rem;
            color: #a5bad6;
            letter-spacing: 0.5px;
        }

        /* ===== ФУТЕР ===== */
        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: #5b7397;
            border-top: 1px solid #1e2f4a;
            padding-top: 2rem;
        }

        .footer i {
            color: #ffd70060;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 700px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 1.5rem;
            }
            .hero-text h1 {
                font-size: 2.2rem;
            }
            .hero-text .sub {
                border-left: none;
                padding-left: 0;
            }
            .hero-text .stats-legend {
                justify-content: center;
            }
            .clubs-grid {
                grid-template-columns: 1fr;
            }
            .totals {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 450px) {
            .hero-text h1 {
                font-size: 1.8rem;
            }
            .club-card .top {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        /* анимация появления */
        .club-card {
            opacity: 0;
            animation: cardFade 0.6s ease forwards;
        }

        @keyframes cardFade {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .club-card:nth-child(1) { animation-delay: 0.05s; }
        .club-card:nth-child(2) { animation-delay: 0.10s; }
        .club-card:nth-child(3) { animation-delay: 0.15s; }
        .club-card:nth-child(4) { animation-delay: 0.20s; }
        .club-card:nth-child(5) { animation-delay: 0.25s; }
        .club-card:nth-child(6) { animation-delay: 0.30s; }
    </style>
</head>
<body>

<div class="container">

    <!-- HERO -->
    <div class="hero">
        <div class="hero-text">
            <div class="badge"><i class="fas fa-crown"></i> Легенда футбола</div>
            <h1>
                <span class="gold">Криштиану Роналду</span>
            </h1>
            <div class="sub">
                <i class="fas fa-futbol" style="color:#ffd700;"></i> 
                Путь сквозь клубы: от Лиссабона до Эр-Рияда
            </div>
            <div class="stats-legend">
                <span><i class="fas fa-trophy"></i> 5× Лига чемпионов</span>
                <span><i class="fas fa-medal"></i> 5× Золотой мяч</span>
                <span><i class="fas fa-fire"></i> 900+ голов</span>
            </div>
        </div>
        <div class="hero-image">
            <img 
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Cristiano_Ronaldo_2018.jpg/640px-Cristiano_Ronaldo_2018.jpg" 
                alt="Криштиану Роналду"
                onerror="this.src='https://via.placeholder.com/220x260?text=CR7'"
            />
        </div>
    </div>

    <!-- ЗАГОЛОВОК КЛУБОВ -->
    <div class="section-header">
        <i class="fas fa-shield-halved"></i>
        <h2>Клубная хронология</h2>
        <span class="line"></span>
    </div>

    <!-- СЕТКА КЛУБОВ (динамическая) -->
    <div class="clubs-grid" id="clubsGrid"></div>

    <!-- СУММАРНАЯ СТАТИСТИКА -->
    <div class="totals" id="totalsBlock">
        <!-- заполняется JS -->
    </div>

    <div class="footer">
        <i class="fas fa-database"></i> Данные на основе официальной карьеры (2002–н.в.) &bull; 
        <i class="fas fa-globe"></i> 6 клубов, 3 континента, 1 легенда
    </div>
</div>

<script>
    // ========== ДАННЫЕ О КЛУБАХ ==========
    const clubs = [
        {
            name: 'Спортинг Лиссабон',
            period: '2002–2003',
            icon: '🦁',
            matches: 31,
            goals: 5,
            assists: 6,
            honors: ['Дебют в основе', 'Привлёк МЮ', 'Юный талант']
        },
        {
            name: 'Манчестер Юнайтед',
            period: '2003–2009',
            icon: '🔴',
            matches: 292,
            goals: 118,
            assists: 69,
            honors: ['3× АПЛ', 'ЛЧ 2008', 'Золотой мяч 2008', 'Клубный ЧМ']
        },
        {
            name: 'Реал Мадрид',
            period: '2009–2018',
            icon: '👑',
            matches: 438,
            goals: 450,
            assists: 131,
            honors: ['4× ЛЧ', '2× Ла Лига', '2× Золотой мяч', 'Лучший бомбардир клуба']
        },
        {
            name: 'Ювентус',
            period: '2018–2021',
            icon: '⚪⚫',
            matches: 134,
            goals: 101,
            assists: 22,
            honors: ['2× Серия А', 'Кубок Италии', '2× Суперкубок']
        },
        {
            name: 'Манчестер Юнайтед',
            period: '2021–2022',
            icon: '🔴',
            matches: 54,
            goals: 27,
            assists: 5,
            honors: ['Возвращение', 'Хет-трик в АПЛ', '800+ голов']
        },
        {
            name: 'Аль-Наср',
            period: '2023–н.в.',
            icon: '💛',
            matches: 68,
            goals: 62,
            assists: 17,
            honors: ['Рекорд Сауд. лиги', 'Кубок арабских чемпионов', 'Лучший бомбардир']
        }
    ];

    // ========== РЕНДЕР КЛУБОВ ==========
    function renderClubs() {
        const grid = document.getElementById('clubsGrid');
        if (!grid) return;

        let html = '';
        clubs.forEach((club) => {
            html += `
                <div class="club-card">
                    <div class="top">
                        <div class="icon">${club.icon}</div>
                        <div class="name">
                            <h3>${club.name}</h3>
                            <div class="period"><i class="far fa-calendar-alt"></i> ${club.period}</div>
                        </div>
                    </div>
                    <div class="stats">
                        <div class="stat">
                            <div class="number">${club.matches}</div>
                            <div class="label">Матчи</div>
                        </div>
                        <div class="stat">
                            <div class="number">${club.goals}</div>
                            <div class="label">Голы</div>
                        </div>
                        <div class="stat">
                            <div class="number">${club.assists}</div>
                            <div class="label">ГП</div>
                        </div>
                    </div>
                    <div class="honors">
                        <p><i class="fas fa-award"></i> Достижения</p>
                        <ul>
                            ${club.honors.map(h => `<li><i class="fas fa-star"></i> ${h}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;
        });

        grid.innerHTML = html;
    }

    // ========== РЕНДЕР СУММАРНОЙ СТАТИСТИКИ ==========
    function renderTotals() {
        const block = document.getElementById('totalsBlock');
        if (!block) return;

        let totalMatches = 0, totalGoals = 0, totalAssists = 0;
        clubs.forEach(c => {
            totalMatches += c.matches;
            totalGoals += c.goals;
            totalAssists += c.assists;
        });

        block.innerHTML = `
            <div class="item">
                <div class="num">${totalMatches}</div>
                <div class="desc"><i class="fas fa-flag"></i> Всего матчей</div>
            </div>
            <div class="item">
                <div class="num" style="color:#f5a623;">${totalGoals}</div>
                <div class="desc"><i class="fas fa-bullseye"></i> Всего голов</div>
            </div>
            <div class="item">
                <div class="num">${totalAssists}</div>
                <div class="desc"><i class="fas fa-eye"></i> Голевых передач</div>
            </div>
            <div class="item">
                <div class="num">${clubs.length}</div>
                <div class="desc"><i class="fas fa-shield"></i> Клубов за карьеру</div>
            </div>
        `;
    }

    // ========== ЗАПУСК ==========
    renderClubs();
    renderTotals();
</script>
</body>
</html>
